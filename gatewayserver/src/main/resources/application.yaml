spring:
  application:
    name: "gatewayserver"

    config:
        import: "optional:configserver:http://localhost:8071/"
    cloud:
      gateway:
        server:
          webflux:
            discovery:
              locator:
                enabled: true

    management:
      endpoints:
        web:
          exposure:
            include: "*"
      health:
        readiness-state:
          enabled: true
        liveness-state:
          enabled: true
      endpoint:
        gateway:
          access: unrestricted
      info:
        env:
          enabled: true

    info:
      app:
        name: "gatewayserver"
        description: "Cloud Gateway server Application"
        version: "1.0.0"



